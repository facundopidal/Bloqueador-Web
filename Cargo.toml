[package]
name = "Bloqueador-Web"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
tray-icon = "0.19.2"
tao = "0.31.0"
native-dialog = "0.7.0"
image = "0.25.9"
log = "0.4"
simplelog = "0.12"
slint = "1.8"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
is_elevated = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1.8"

